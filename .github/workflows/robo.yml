name: CryptoMind Daily Trader

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Puxar o Código do Repositório
      uses: actions/checkout@v4 # Atualizado para v4 (remove o aviso do Node)

    - name: Preparar o Python (O Cérebro)
      uses: actions/setup-python@v5 # Atualizado para v5 (remove o aviso do Node)
      with:
        python-version: '3.10'

    - name: Instalar a Caixa de Ferramentas (Bibliotecas)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn python-dotenv python-binance yfinance

    - name: Acordar o Oráculo (Executar o Pipeline)
      env:
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
      run: |
        python Extractor_Binance.py
        python coletor_macro.py
        python Engenharia_dados.py
        python engenharia_macro.py
        python machine_learning.py
        python oraculo.py
